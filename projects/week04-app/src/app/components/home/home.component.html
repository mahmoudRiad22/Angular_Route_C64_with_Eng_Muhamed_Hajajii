<!-- >> Transfer Data between parent and children:

? parent =====> selector [] =====> Child
? child  =====> selector () =====> parent
? child  =====> selector () =====> parent =====> selector []=====> Child


    * 1- from Parent to child: 
          --using the [@Input]
          -- data flow:
              parent     =====>      selector        =====>  child
              [property]         [property binding]         [@Input]
    * 2- from parent to child:
          -- using the (@output + EventEmitter)
          -- Data Flow:
              child     =====>      selector        =====>  parent
    [@output EventEmitter]       (Event binding)           [property]
                                        +
                                  property = $event

    * 3- from child to another child: [Sibling]
          -- using both @input (@Output + eventEmitter)
          -- Data Flow:
              child      =====>      selector     =====>  parent     =====>      selector        =====>  child
    [@output EventEmitter]       (Event binding)        [property]         [property binding]          [@Input]
                                        +
                                  property = $event

-->
